<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 832" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="adaptive-loop-title adaptive-loop-desc" id="adaptive-loop-root">
<title id="adaptive-loop-title">Adaptive prequential replay</title>
<desc id="adaptive-loop-desc">Candidate forecasts are saved before future labels are scored, complete labels permit updates, and boundary selection carries the selected trained state forward.</desc>
<defs>
      <style>#adaptive-loop-root { color: #182f40; font-family: 'Geist', system-ui, sans-serif; }
      #adaptive-loop-root .diagram-container { width:100%;overflow-x:auto }
      #adaptive-loop-root a { color:#246f94 }
      @media print {
#adaptive-loop-root .diagram-container { overflow-x:visible }
}</style>
<marker id="adaptive-loop-arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#4b6170"/>
</marker>
<marker id="adaptive-loop-arrow-accent" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#a64c2f"/>
</marker>
<marker id="adaptive-loop-arrow-link" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#246f94"/>
</marker>
</defs>
<rect width="1280" height="832" fill="#ffffff"/>
<text x="64" y="52" fill="#4b6170" font-size="10" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">ADAPTIVE RETENTION / 03</text>
<text x="64" y="100" fill="#182f40" font-size="32" font-weight="400" font-family="'Instrument Serif', 'Noto Serif', serif" text-anchor="start">Adaptive replay</text>
<text x="64" y="128" fill="#4b6170" font-size="12" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">One origin across replay ticks: predict first, learn only after label availability.</text>
<path d="M 352 240 L 496 240" fill="none" stroke="#4b6170" stroke-width="1.4" marker-end="url(#adaptive-loop-arrow)"/>
<rect x="384.5" y="207" width="79" height="18" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="1.2"/>
<text x="424" y="220" fill="#4b6170" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">NEW BLOCK</text>
<path d="M 784 240 L 928 240" fill="none" stroke="#4b6170" stroke-width="1.4" marker-end="url(#adaptive-loop-arrow)"/>
<rect x="799.0" y="207" width="114" height="18" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="1.2"/>
<text x="856" y="220" fill="#4b6170" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">ALL CANDIDATES</text>
<path d="M 1072 288 L 1072 416" fill="none" stroke="#246f94" stroke-width="1.4" marker-end="url(#adaptive-loop-arrow-link)"/>
<rect x="1101.0" y="347" width="86" height="18" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="1.2"/>
<text x="1144" y="360" fill="#4b6170" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">LATER TICK</text>
<path d="M 960 472 L 784 472" fill="none" stroke="#246f94" stroke-width="1.4" marker-end="url(#adaptive-loop-arrow-link)"/>
<rect x="836.0" y="439" width="72" height="18" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="1.2"/>
<text x="872" y="452" fill="#4b6170" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">COMPLETE</text>
<path d="M 640 424 L 640 288" fill="none" stroke="#246f94" stroke-width="1.4" marker-end="url(#adaptive-loop-arrow-link)"/>
<rect x="657.5" y="347" width="93" height="18" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="1.2"/>
<text x="704" y="360" fill="#4b6170" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">NEXT ORIGIN</text>
<path d="M 496 472 L 352 472" fill="none" stroke="#a64c2f" stroke-width="1.4" marker-end="url(#adaptive-loop-arrow-accent)"/>
<rect x="377.5" y="439" width="93" height="18" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="1.2"/>
<text x="424" y="452" fill="#4b6170" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">BLOCK ENDED</text>
<path d="M 208 424 L 208 288" fill="none" stroke="#a64c2f" stroke-width="1.4" marker-end="url(#adaptive-loop-arrow-accent)"/>
<rect x="233.5" y="347" width="93" height="18" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="1.2"/>
<text x="280" y="360" fill="#4b6170" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">CARRY STATE</text>
<path d="M 1072 528 L 1072 616" fill="none" stroke="#4b6170" stroke-width="1.4" marker-end="url(#adaptive-loop-arrow)" stroke-dasharray="5,4"/>
<rect x="1120.5" y="567" width="79" height="18" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="1.2"/>
<text x="1160" y="580" fill="#4b6170" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">OTHERWISE</text>
<rect x="64" y="192" width="288" height="96" rx="6" fill="#ffffff" stroke="#c5d1d8" stroke-width="1.2"/>
<text x="84" y="216" fill="#4b6170" font-size="10" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">BLOCK INITIALIZATION</text>
<text x="84" y="244" fill="#182f40" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Fork candidate states</text>
<text x="84" y="268" fill="#4b6170" font-size="12" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Weights + Adam + paired RNG</text>
<rect x="496" y="192" width="288" height="96" rx="6" fill="#ffffff" stroke="#c5d1d8" stroke-width="1.2"/>
<text x="516" y="216" fill="#4b6170" font-size="10" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">PREDICTION</text>
<text x="516" y="244" fill="#182f40" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Issue 24-hour forecasts</text>
<text x="516" y="268" fill="#4b6170" font-size="12" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Deploy only active prediction</text>
<rect x="928" y="192" width="288" height="96" rx="6" fill="#f3f7f9" stroke="#c5d1d8" stroke-width="1.2"/>
<path d="M 944 204 H 1200" stroke="#4b6170" fill="none"/>
<text x="948" y="216" fill="#4b6170" font-size="10" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">BEFORE LABEL ACCESS</text>
<text x="948" y="244" fill="#182f40" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Persist forecasts</text>
<text x="948" y="268" fill="#4b6170" font-size="12" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Flush + fsync; bind identity</text>
<polygon points="1072,416 1184,472 1072,528 960,472" fill="#ffffff" stroke="#246f94" stroke-width="1.4"/>
<text x="1072" y="468" fill="#182f40" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Labels ready?</text>
<text x="1072" y="492" fill="#4b6170" font-size="12" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">24 values</text>
<rect x="496" y="424" width="288" height="96" rx="6" fill="#ffffff" stroke="#c5d1d8" stroke-width="1.2"/>
<text x="516" y="448" fill="#4b6170" font-size="10" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">COMPLETE LABELS ONLY</text>
<text x="516" y="476" fill="#182f40" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Score, then update</text>
<text x="516" y="500" fill="#4b6170" font-size="12" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Frozen source reference</text>
<rect x="64" y="424" width="288" height="96" rx="6" fill="#fbf3ef" stroke="#a64c2f" stroke-width="1.2"/>
<text x="84" y="448" fill="#a64c2f" font-size="10" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">AT BLOCK BOUNDARY</text>
<text x="84" y="476" fill="#182f40" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Choose retention</text>
<text x="84" y="500" fill="#4b6170" font-size="12" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">LCB &gt; delta; otherwise keep</text>
<rect x="928" y="616" width="288" height="96" rx="6" fill="#f3f7f9" stroke="#c5d1d8" stroke-width="1.2"/>
<path d="M 944 628 H 1200" stroke="#4b6170" fill="none"/>
<text x="948" y="640" fill="#4b6170" font-size="10" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">NO PARTIAL-DAY UPDATE</text>
<text x="948" y="668" fill="#182f40" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Wait or skip</text>
<text x="948" y="692" fill="#4b6170" font-size="12" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Pending waits; incomplete skips</text>
<text x="64" y="644" fill="#182f40" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Keep means keep the trained incumbent.</text>
<text x="64" y="672" fill="#4b6170" font-size="12" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">No reset to block-start weights; the selected state seeds the next block.</text>
<path d="M 64 752 H 1216" stroke="#c5d1d8"/>
<text x="64" y="780" fill="#4b6170" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">BLUE: access / flow    ORANGE: focal operation    GRAY: data or state</text>
<text x="64" y="804" fill="#4b6170" font-size="12" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Lower bounds describe past-block evidence. They do not guarantee future improvement or lower total computation.</text>
</svg>
