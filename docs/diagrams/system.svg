<text x="516" y="460" fill="#182f40" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Forecasts, events, state</text>
<text x="516" y="484" fill="#4b6170" font-size="12" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Immutable run artifacts</text>
<rect x="64" y="408" width="288" height="96" rx="6" fill="#ffffff" stroke="#c5d1d8" stroke-width="1.2"/>
<text x="84" y="432" fill="#4b6170" font-size="10" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">EVALUATION</text>
<text x="84" y="460" fill="#182f40" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Verify and analyze</text>
<text x="84" y="484" fill="#4b6170" font-size="12" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">ev_evaluation + tools</text>
<rect x="64" y="584" width="400" height="96" rx="6" fill="#ffffff" stroke="#c5d1d8" stroke-width="1.2"/>
<text x="84" y="608" fill="#4b6170" font-size="10" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">DELIVERABLE</text>
<text x="84" y="636" fill="#182f40" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Report + supplement</text>
<text x="84" y="660" fill="#4b6170" font-size="12" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">Source, figures, result tables</text>
<text x="544" y="612" fill="#182f40" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Separate member implementations</text>
<text x="544" y="640" fill="#4b6170" font-size="12" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Supporting and diagnostic studies retain separate configurations.</text>
<text x="544" y="664" fill="#4b6170" font-size="12" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Their scores are not pooled with the primary pipeline.</text>
<path d="M 64 728 H 1216" stroke="#c5d1d8"/>
<text x="64" y="756" fill="#4b6170" font-size="10" font-weight="400" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start">BLUE: access / flow    ORANGE: focal operation    GRAY: data or state</text>
<text x="64" y="780" fill="#4b6170" font-size="12" font-weight="400" font-family="'Geist', system-ui, sans-serif" text-anchor="start">Logical research components, not a deployed charging service. Historical results retain their original execution identity.</text>
