<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 808" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="system-title system-desc" id="system-root">
<title id="system-title">Research system</title>
<desc id="system-desc">Prepared inputs feed source training and target adaptation, followed by causal replay, stored artifacts, verification and reporting.</desc>
<defs>
      <style>#system-root { color: #182f40; font-family: 'Geist', system-ui, sans-serif; }
      #system-root .diagram-container { width:100%;overflow-x:auto }
      #system-root a { color:#246f94 }
      @media print {
#system-root .diagram-container { overflow-x:visible }
}</style>
