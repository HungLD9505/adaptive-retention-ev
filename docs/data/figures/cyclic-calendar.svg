<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Cyclic hour and weekday features for the model input contract</title>
<desc id="desc">A 24-hour circle highlights 23:00 next to 00:00. A seven-day circle highlights Sunday next to Monday. Both use horizontal x=sin(theta) and vertical y=cos(theta), so zero is at the top and values increase clockwise. These are proposed calendar encodings, not measured charging data.</desc>
<rect width="1200" height="760" fill="white"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.muted{fill:#596579}.teal{fill:#008779}.label{font-size:15px}.formula{font-size:19px}</style>

<text x="32" y="43" font-size="28" text-anchor="start" class="" font-weight="bold">Calendar cycles → two numeric features</text>
<text x="32" y="73" font-size="16" text-anchor="start" class="muted" font-weight="normal">Proposed encoding in INPUT_CONTRACT.md · local calendar labels · no charging measurements</text>
